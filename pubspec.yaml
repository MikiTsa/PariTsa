name: expenses_tracker
description: "A personal expenses tracker application."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.9
  uuid: ^4.0.0
  intl: ^0.20.2
  firebase_core: ^4.2.0
  cloud_firestore: ^6.0.3
  firebase_auth: ^6.1.1
  google_sign_in: ^6.3.0
  shared_preferences: ^2.3.0
  flutter_local_notifications: ^18.0.0
  local_auth: ^2.3.0
  firebase_messaging: ^16.1.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3
  image: ^4.0.0

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon_padded_white.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon_padded_white.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/google_logo.png
    - assets/temp_icon.png
    - assets/expense_icon.png
    - assets/income_icon.png
    - assets/saving_icon.png
    - assets/logo_PariTsa_white.png
    - assets/logo_PariTsa_black.png
    - assets/logo_PariTsa_white_uncropped.png
    - assets/logo_PariTsa_black_uncropped.png
    - assets/icon_padded_white.png
    - assets/icon_padded_black.png